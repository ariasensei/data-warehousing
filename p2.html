  <script src="/_sdk/c939c145c3c74230.editing_sdk.js" integrity="sha512-jh2pv/gl9Gzzn5dxfzwQO4wkqtnAQIim+LIUDYfVu2cdqPkQV2MqbjsDUW5IYbrSZFjRlOBrIWzlvWDXQYxOjg=="></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      function toggleAnswer(buttonId, answerId) {
        const button = document.getElementById(buttonId);
        const answer = document.getElementById(answerId);

        button.addEventListener("click", () => {
          const isOpen = answer.classList.toggle("open");
          button.setAttribute("aria-expanded", String(isOpen));
        });
      }

      toggleAnswer("activity-one-button", "activity-one-answer");
      toggleAnswer("activity-two-button", "activity-two-answer");

      const answers = {
        q1: "b",
        q2: "c",
        q3: "a",
        q4: "b",
        q5: "a"
      };

      const explanations = {
        q1: "Correct: a warehouse organizes integrated data for analysis and decision-making.",
        q2: "Correct: the staging area is a temporary preparation zone for incoming data.",
        q3: "Correct: ETL means Extract, Transform, Load.",
        q4: "Correct: a warehouse is built for historical analysis, reporting, and large queries.",
        q5: "Correct: a data mart gives a department-focused view of warehouse data."
      };

      const selectedAnswers = {};

      document.querySelectorAll(".quiz-option").forEach((option) => {
        option.addEventListener("click", () => {
          const question = option.parentElement.dataset.question;

          if (document.getElementById("quiz-summary").classList.contains("hidden") === false) {
            return;
          }

          option.parentElement.querySelectorAll(".quiz-option").forEach((item) => {
            item.classList.remove("selected");
          });

          option.classList.add("selected");
          selectedAnswers[question] = option.dataset.option;
        });
      });

      document.getElementById("quiz-form").addEventListener("submit", (event) => {
        event.preventDefault();

        let score = 0;

        Object.keys(answers).forEach((question) => {
          const feedback = document.getElementById("feedback-" + question);
          const options = document.querySelectorAll('[data-question="' + question + '"] .quiz-option');
          const selected = selectedAnswers[question];

          options.forEach((option) => {
            option.classList.remove("correct", "incorrect");

            if (option.dataset.option === answers[question]) {
              option.classList.add("correct");
            }

            if (selected && option.dataset.option === selected && selected !== answers[question]) {
              option.classList.add("incorrect");
            }
          });

          feedback.classList.remove("hidden");

          if (selected === answers[question]) {
            score += 1;
            feedback.textContent = explanations[question];
            feedback.className = "mt-4 text-sm font-semibold text-green-700";
          } else if (!selected) {
            feedback.textContent = "No answer selected. " + explanations[question];
            feedback.className = "mt-4 text-sm font-semibold text-amber-700";
          } else {
            feedback.textContent = "Not quite. " + explanations[question];
            feedback.className = "mt-4 text-sm font-semibold text-red-700";
          }
        });

        const summary = document.getElementById("quiz-summary");
        const scoreText = document.getElementById("quiz-score");
        const message = document.getElementById("quiz-message");
        const retryButton = document.getElementById("retry-quiz-button");
        const checkButton = document.getElementById("check-quiz-button");

        scoreText.textContent = score + " / 5";
        message.textContent = score === 5
          ? "Excellent work — you are ready to explain the main architecture flow."
          : score >= 3
            ? "Good progress. Review the feedback, then try again to strengthen the details."
            : "Keep going. Revisit the architecture flow and the layer definitions, then retry.";

        summary.classList.remove("hidden");
        retryButton.classList.remove("hidden");
        checkButton.classList.add("hidden");
      });

      document.getElementById("retry-quiz-button").addEventListener("click", () => {
        Object.keys(selectedAnswers).forEach((key) => delete selectedAnswers[key]);

        document.querySelectorAll(".quiz-option").forEach((option) => {
          option.classList.remove("selected", "correct", "incorrect");
        });

        document.querySelectorAll('[id^="feedback-"]').forEach((feedback) => {
          feedback.textContent = "";
          feedback.classList.add("hidden");
        });

        document.getElementById("quiz-summary").classList.add("hidden");
        document.getElementById("retry-quiz-button").classList.add("hidden");
        document.getElementById("check-quiz-button").classList.remove("hidden");
      });
    });
  </script>
